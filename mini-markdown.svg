<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#0f1219; font-family: system-ui, sans-serif;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="800" height="40" fill="#181e2a" />
  <circle cx="20" cy="20" r="5" fill="#ef4444" />
  <circle cx="36" cy="20" r="5" fill="#f59e0b" />
  <circle cx="52" cy="20" r="5" fill="#10b981" />
  <text x="400" y="25" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">Live Markdown Previewer — Split Editor</text>
  
  <!-- Left Editor Pane -->
  <rect x="15" y="55" width="375" height="380" rx="8" fill="#131722" stroke="#1e293b" />
  <text x="30" y="85" fill="#64748b" font-size="12" font-family="monospace"># Markdown Editor</text>
  <text x="30" y="110" fill="#38bdf8" font-size="13" font-family="monospace">## **Live Preview &amp; Syntax**</text>
  <text x="30" y="135" fill="#a855f7" font-size="12" font-family="monospace">- [x] Instant Rendering</text>
  <text x="30" y="155" fill="#a855f7" font-size="12" font-family="monospace">- [x] Syntax Highlighting</text>
  <text x="30" y="175" fill="#a855f7" font-size="12" font-family="monospace">- [x] Character Counter</text>
  <text x="30" y="210" fill="#f59e0b" font-size="12" font-family="monospace">```javascript</text>
  <text x="30" y="230" fill="#e2e8f0" font-size="12" font-family="monospace">const render = (md) => marked(md);</text>
  <text x="30" y="250" fill="#f59e0b" font-size="12" font-family="monospace">```</text>

  <!-- Right Preview Pane -->
  <rect x="410" y="55" width="375" height="380" rx="8" fill="#1a202c" stroke="#334155" />
  <text x="430" y="90" fill="#f8fafc" font-size="20" font-weight="800">Markdown Editor</text>
  <line x1="430" y1="100" x2="760" y2="100" stroke="#334155" stroke-width="1" />
  <text x="430" y="125" fill="#38bdf8" font-size="16" font-weight="700">Live Preview &amp; Syntax</text>
  <text x="450" y="150" fill="#cbd5e1" font-size="13">✓ Instant Rendering</text>
  <text x="450" y="170" fill="#cbd5e1" font-size="13">✓ Syntax Highlighting</text>
  <text x="450" y="190" fill="#cbd5e1" font-size="13">✓ Character Counter</text>

  <rect x="430" y="210" width="335" height="50" rx="6" fill="#0f172a" stroke="#1e293b" />
  <text x="445" y="240" fill="#38bdf8" font-size="12" font-family="monospace">const render = (md) => marked(md);</text>
  <rect x="680" y="380" width="90" height="32" rx="16" fill="#10b981" />
  <text x="725" y="401" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Export HTML</text>
