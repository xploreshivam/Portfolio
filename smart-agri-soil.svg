<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background-color: #08110e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="agriSoilGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#05140d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11221b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a1812" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#agriSoilGlow)" />

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#061610" opacity="0.95" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#16382a" stroke-width="1" />
  
  <g transform="translate(48, 20)">
    <circle cx="12" cy="12" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M12 4C7.5 4 4 7.5 4 12c0 4.5 8 10 8 10s8-5.5 8-10c0-4.5-3.5-8-8-8z" fill="#10b981"/>
    <text x="34" y="17" fill="#ffffff" font-weight="700" font-size="20" letter-spacing="-0.3">Agri-Smart</text>
    <text x="145" y="17" fill="#34d399" font-weight="500" font-size="13">/ Soil Quality Analysis</text>
  </g>

  <g transform="translate(1040, 18)">
    <rect width="112" height="32" rx="16" fill="#133324" stroke="#10b981" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#10b981"/>
    <text x="64" y="21" fill="#ecfdf5" font-size="12" font-weight="600" text-anchor="middle">Live Sensor</text>
  </g>

  <!-- Title & Status -->
  <text x="48" y="112" fill="#ffffff" font-size="28" font-weight="800">Precision Soil &amp; Nutrient Intelligence</text>
  <text x="48" y="136" fill="#6ee7b7" font-size="14">Real-time IoT sensor telemetry • Sector 4B Field Station</text>

  <!-- 4 KPI Metrics -->
  <g transform="translate(48, 160)">
    <!-- Soil Moisture -->
    <rect width="260" height="110" rx="14" fill="url(#cardGrad)" stroke="#16382a" stroke-width="1.5"/>
    <text x="24" y="38" fill="#9ca3af" font-size="13" font-weight="500">Soil Moisture</text>
    <text x="24" y="78" fill="#ffffff" font-size="34" font-weight="800">68.4%</text>
    <text x="148" y="76" fill="#10b981" font-size="13" font-weight="600">✓ Optimal</text>
    <rect x="24" y="92" width="212" height="6" rx="3" fill="#1b382b"/>
    <rect x="24" y="92" width="145" height="6" rx="3" fill="url(#greenBar)"/>

    <!-- pH Level -->
    <g transform="translate(284, 0)">
      <rect width="260" height="110" rx="14" fill="url(#cardGrad)" stroke="#16382a" stroke-width="1.5"/>
      <text x="24" y="38" fill="#9ca3af" font-size="13" font-weight="500">Soil pH Index</text>
      <text x="24" y="78" fill="#ffffff" font-size="34" font-weight="800">6.5</text>
      <text x="120" y="76" fill="#34d399" font-size="13" font-weight="600">Neutral (Ideal)</text>
      <rect x="24" y="92" width="212" height="6" rx="3" fill="#1b382b"/>
      <rect x="24" y="92" width="138" height="6" rx="3" fill="#34d399"/>
    </g>

    <!-- Temperature -->
    <g transform="translate(568, 0)">
      <rect width="260" height="110" rx="14" fill="url(#cardGrad)" stroke="#16382a" stroke-width="1.5"/>
      <text x="24" y="38" fill="#9ca3af" font-size="13" font-weight="500">Root Zone Temp</text>
      <text x="24" y="78" fill="#ffffff" font-size="34" font-weight="800">22.8°C</text>
      <text x="160" y="76" fill="#10b981" font-size="13" font-weight="600">Normal</text>
      <rect x="24" y="92" width="212" height="6" rx="3" fill="#1b382b"/>
      <rect x="24" y="92" width="160" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Electrical Cond. -->
    <g transform="translate(852, 0)">
      <rect width="252" height="110" rx="14" fill="url(#cardGrad)" stroke="#16382a" stroke-width="1.5"/>
      <text x="24" y="38" fill="#9ca3af" font-size="13" font-weight="500">EC Salinity</text>
      <text x="24" y="78" fill="#ffffff" font-size="34" font-weight="800">1.4 dS/m</text>
      <text x="175" y="76" fill="#10b981" font-size="13" font-weight="600">Low</text>
      <rect x="24" y="92" width="204" height="6" rx="3" fill="#1b382b"/>
      <rect x="24" y="92" width="120" height="6" rx="3" fill="#10b981"/>
    </g>
  </g>

  <!-- Large Diagnostic Board: NPK Nutrition Breakdown & Recommendation -->
  <g transform="translate(48, 300)">
    <!-- NPK Breakdown Panel -->
    <rect width="680" height="330" rx="16" fill="url(#cardGrad)" stroke="#16382a" stroke-width="1.5"/>
    <text x="32" y="44" fill="#ffffff" font-size="20" font-weight="700">NPK Macro-Nutrient Composition</text>
    <text x="32" y="68" fill="#9ca3af" font-size="13">Optical spectrometer lab-grade analysis vs target crops</text>

    <!-- Nitrogen -->
    <text x="32" y="116" fill="#e5e7eb" font-size="15" font-weight="600">Nitrogen (N)</text>
    <text x="590" y="116" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">142 mg/kg</text>
    <rect x="32" y="128" width="560" height="12" rx="6" fill="#162e24"/>
    <rect x="32" y="128" width="430" height="12" rx="6" fill="#10b981"/>

    <!-- Phosphorus -->
    <text x="32" y="176" fill="#e5e7eb" font-size="15" font-weight="600">Phosphorus (P)</text>
    <text x="590" y="176" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">48 mg/kg</text>
    <rect x="32" y="188" width="560" height="12" rx="6" fill="#162e24"/>
    <rect x="32" y="188" width="310" height="12" rx="6" fill="#059669"/>

    <!-- Potassium -->
    <text x="32" y="236" fill="#e5e7eb" font-size="15" font-weight="600">Potassium (K)</text>
    <text x="590" y="236" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">195 mg/kg</text>
    <rect x="32" y="248" width="560" height="12" rx="6" fill="#162e24"/>
    <rect x="32" y="248" width="480" height="12" rx="6" fill="#10b981"/>

    <text x="32" y="295" fill="#6ee7b7" font-size="13">Fertilizer Requirement: Urea + DAP optimal at 15kg/acre</text>
  </g>

  <!-- AI Agronomist Recommendation Panel -->
  <g transform="translate(752, 300)">
    <rect width="400" height="330" rx="16" fill="url(#cardGrad)" stroke="#16382a" stroke-width="1.5"/>
    <circle cx="48" cy="48" r="20" fill="#10b981" opacity="0.2"/>
    <path d="M48 38 L54 50 L42 50 Z" fill="#10b981"/>
    <text x="80" y="52" fill="#ffffff" font-size="20" font-weight="700">AI Crop Match</text>
    <text x="32" y="105" fill="#e5e7eb" font-size="16" font-weight="600">Highest Recommended Crops:</text>
    
    <rect x="32" y="125" width="336" height="48" rx="10" fill="#132b21" stroke="#10b981" stroke-width="1"/>
    <text x="48" y="154" fill="#ffffff" font-weight="700" font-size="15">1. Wheat (PBW 343)</text>
    <text x="340" y="154" fill="#34d399" font-weight="700" font-size="14" text-anchor="end">98.4% Match</text>

    <rect x="32" y="185" width="336" height="48" rx="10" fill="#0d211a" stroke="#16382a" stroke-width="1"/>
    <text x="48" y="214" fill="#ffffff" font-weight="700" font-size="15">2. Barley &amp; Mustard</text>
    <text x="340" y="214" fill="#34d399" font-weight="700" font-size="14" text-anchor="end">94.1% Match</text>

    <rect x="32" y="245" width="336" height="56" rx="10" fill="#0d211a" stroke="#16382a" stroke-width="1"/>
    <text x="48" y="270" fill="#9ca3af" font-size="12">Next Irrigation Window:</text>
    <text x="48" y="288" fill="#6ee7b7" font-weight="700" font-size="13">Tomorrow at 06:30 AM (22mm suggested)</text>
  </g>
</svg>
