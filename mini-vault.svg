<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <rect width="800" height="450" fill="#0f172a" />
  <text x="400" y="45" fill="#f59e0b" font-size="20" font-weight="800" text-anchor="middle">Quick Code Snippet Bucket 📦</text>

  <!-- Search Bar -->
  <rect x="150" y="70" width="500" height="42" rx="21" fill="#1e293b" stroke="#334155" />
  <text x="180" y="96" fill="#64748b" font-size="14">🔍 Search snippets by tag or title...</text>

  <!-- Snippet Cards Container -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="280" height="250" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="20" y="35" fill="#f8fafc" font-size="16" font-weight="700">Debounce Function</text>
    <rect x="20" y="48" width="60" height="20" rx="10" fill="rgba(245, 158, 11, 0.2)" />
    <text x="50" y="62" fill="#f59e0b" font-size="11" text-anchor="middle">JS</text>
    
    <rect x="15" y="80" width="250" height="110" rx="6" fill="#0f172a" />
    <text x="25" y="105" fill="#38bdf8" font-size="11" font-family="monospace">const debounce = (fn, d) =&gt; {</text>
    <text x="25" y="125" fill="#e2e8f0" font-size="11" font-family="monospace">  let t;</text>
    <text x="25" y="145" fill="#e2e8f0" font-size="11" font-family="monospace">  return (...args) =&gt; {</text>
    <text x="25" y="165" fill="#e2e8f0" font-size="11" font-family="monospace">    clearTimeout(t); ...</text>

    <rect x="20" y="205" width="240" height="32" rx="6" fill="#3b82f6" />
    <text x="140" y="226" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Copy Snippet</text>


    <rect x="300" y="0" width="280" height="250" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="320" y="35" fill="#f8fafc" font-size="16" font-weight="700">Flex Center Utility</text>
    <rect x="320" y="48" width="60" height="20" rx="10" fill="rgba(56, 189, 248, 0.2)" />
    <text x="350" y="62" fill="#38bdf8" font-size="11" text-anchor="middle">CSS</text>
    
    <rect x="315" y="80" width="250" height="110" rx="6" fill="#0f172a" />
    <text x="325" y="105" fill="#38bdf8" font-size="11" font-family="monospace">.flex-center {</text>
    <text x="325" y="125" fill="#e2e8f0" font-size="11" font-family="monospace">  display: flex;</text>
    <text x="325" y="145" fill="#e2e8f0" font-size="11" font-family="monospace">  align-items: center;</text>
    <text x="325" y="165" fill="#e2e8f0" font-size="11" font-family="monospace">  justify-content: center;</text>

    <rect x="320" y="205" width="240" height="32" rx="6" fill="#3b82f6" />
    <text x="440" y="226" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Copy Snippet</text>
  </g>
</svg>
