<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background-color: #05140e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="cardioPulseRepGlow" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#093824" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#030e09" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#cardioPulseRepGlow)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="64" fill="#071b12" opacity="0.95" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#123827" stroke-width="1" />
  
  <g transform="translate(48, 20)">
    <circle cx="12" cy="12" r="14" fill="#10b981" opacity="0.25"/>
    <path d="M4 12 h4 l2 -6 l4 12 l3 -8 l2 4 h5" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="36" y="17" fill="#ffffff" font-weight="800" font-size="20">CardioPulse</text>
    <text x="160" y="17" fill="#6ee7b7" font-weight="500" font-size="13">/ Clinical Diagnostic Report</text>
  </g>

  <g transform="translate(1010, 18)">
    <rect width="142" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="71" y="21" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">Export PDF Report</text>
  </g>

  <!-- Title -->
  <text x="48" y="112" fill="#ffffff" font-size="28" font-weight="800">Comprehensive AI Health Dossier &amp; Prescriptive Insights</text>
  <text x="48" y="136" fill="#6ee7b7" font-size="14">Patient ID: #CP-98241 • Clinical Grade Evaluation • Validated against Framingham Dataset</text>

  <!-- Two Column Layout -->
  <g transform="translate(48, 160)">
    <!-- Left Column: Patient Summary & AI Interpretation -->
    <rect width="530" height="465" rx="16" fill="#0a2117" stroke="#15422e" stroke-width="1.5"/>
    <text x="32" y="44" fill="#ffffff" font-size="20" font-weight="700">Clinical Evaluation Summary</text>

    <g transform="translate(32, 70)">
      <rect width="466" height="75" rx="10" fill="#05170f" stroke="#123827" stroke-width="1"/>
      <text x="20" y="30" fill="#9ca3af" font-size="12">AI Risk Conclusion:</text>
      <text x="20" y="54" fill="#34d399" font-size="16" font-weight="700">Minimal Coronary Heart Disease Probability (Tier 1 Low)</text>
    </g>

    <text x="32" y="185" fill="#e5e7eb" font-size="15" font-weight="600">Model Feature Contributions (SHAP Values):</text>

    <!-- SHAP Factor 1 -->
    <text x="32" y="220" fill="#9ca3af" font-size="13">1. Resting Blood Pressure (120 mmHg)</text>
    <text x="498" y="220" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">-0.42 (Protective)</text>
    <rect x="32" y="230" width="466" height="6" rx="3" fill="#133626"/>
    <rect x="32" y="230" width="160" height="6" rx="3" fill="#10b981"/>

    <!-- SHAP Factor 2 -->
    <text x="32" y="270" fill="#9ca3af" font-size="13">2. Cholesterol Level (178 mg/dL)</text>
    <text x="498" y="270" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">-0.35 (Protective)</text>
    <rect x="32" y="280" width="466" height="6" rx="3" fill="#133626"/>
    <rect x="32" y="280" width="140" height="6" rx="3" fill="#10b981"/>

    <!-- SHAP Factor 3 -->
    <text x="32" y="320" fill="#9ca3af" font-size="13">3. Physical Activity Index (4.5 hrs/wk)</text>
    <text x="498" y="320" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">-0.28 (Protective)</text>
    <rect x="32" y="330" width="466" height="6" rx="3" fill="#133626"/>
    <rect x="32" y="330" width="120" height="6" rx="3" fill="#10b981"/>

    <!-- SHAP Factor 4 -->
    <text x="32" y="370" fill="#9ca3af" font-size="13">4. Age Adjustment Coefficient</text>
    <text x="498" y="370" fill="#facc15" font-size="13" font-weight="700" text-anchor="end">+0.12 (Neutral)</text>
    <rect x="32" y="380" width="466" height="6" rx="3" fill="#133626"/>
    <rect x="32" y="380" width="60" height="6" rx="3" fill="#facc15"/>

    <text x="32" y="430" fill="#6ee7b7" font-size="13">Physician Sign-off: Automated model review verified by Cardiologist</text>

    <!-- Right Column: Actionable Recommendations -->
    <g transform="translate(554, 0)">
      <rect width="550" height="465" rx="16" fill="#0a2117" stroke="#15422e" stroke-width="1.5"/>
      <text x="32" y="44" fill="#ffffff" font-size="20" font-weight="700">Personalized Health Prescription</text>

      <!-- Rec 1: Nutrition -->
      <g transform="translate(32, 70)">
        <rect width="486" height="95" rx="12" fill="#05170f" stroke="#123827" stroke-width="1"/>
        <text x="24" y="32" fill="#34d399" font-size="16" font-weight="700">🥗 Mediterranean Dietary Profile</text>
        <text x="24" y="56" fill="#9ca3af" font-size="13">Prioritize Omega-3 fatty acids (flaxseed, walnuts, salmon),</text>
        <text x="24" y="76" fill="#9ca3af" font-size="13">maintain sodium intake below 2,000 mg/day.</text>
      </g>

      <!-- Rec 2: Exercise -->
      <g transform="translate(32, 185)">
        <rect width="486" height="95" rx="12" fill="#05170f" stroke="#123827" stroke-width="1"/>
        <text x="24" y="32" fill="#34d399" font-size="16" font-weight="700">🏃 Aerobic &amp; Zone 2 Cardiovascular Training</text>
        <text x="24" y="56" fill="#9ca3af" font-size="13">Target 150-180 minutes per week of brisk walking, swimming,</text>
        <text x="24" y="76" fill="#9ca3af" font-size="13">or cycling in heart rate zone 110-130 BPM.</text>
      </g>

      <!-- Rec 3: Sleep & Stress -->
      <g transform="translate(32, 300)">
        <rect width="486" height="95" rx="12" fill="#05170f" stroke="#123827" stroke-width="1"/>
        <text x="24" y="32" fill="#34d399" font-size="16" font-weight="700">🌙 Circadian Sleep Hygiene &amp; Recovery</text>
        <text x="24" y="56" fill="#9ca3af" font-size="13">Maintain 7.5 to 8 hours consistent sleep window.</text>
        <text x="24" y="76" fill="#9ca3af" font-size="13">Cortisol regulation through morning sunlight exposure.</text>
      </g>

      <rect x="32" y="410" width="486" height="36" rx="8" fill="#10b981"/>
      <text x="275" y="433" fill="#022c22" font-size="13" font-weight="700" text-anchor="middle">✓ Next Scheduled Follow-up: 12 Months</text>
    </g>
  </g>
</svg>
