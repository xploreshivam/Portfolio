<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background-color: #0b0f14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Background glow -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#102a1e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="1"/>
    </radialGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGlow)" />

  <!-- Navigation Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0d131a" opacity="0.9" />
  <g transform="translate(40, 18)">
    <!-- Leaf logo -->
    <path d="M12 2C6.5 2 2 6.5 2 12c0 5.5 4.5 10 10 10 1.5 0 2.5-1 2.5-2.5 0-1-.5-2-1.5-2.5C11 16 10 14.5 10 13c0-2.8 2.2-5 5-5h4c.6 0 1-.4 1-1 0-2.8-2.2-5-5-5zm-2 15c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="#10b981" />
    <text x="32" y="18" fill="#ffffff" font-weight="700" font-size="20">Agri-Smart</text>
  </g>

  <!-- Nav links -->
  <g transform="translate(580, 36)" font-size="14" fill="#9ca3af" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff">Home</text>
    <text x="70" y="0">Crop Yield</text>
    <text x="160" y="0">Soil Quality</text>
    <text x="250" y="0">Fertilizer</text>
    <text x="330" y="0">Disease</text>
    <text x="400" y="0">Weather</text>
  </g>

  <!-- Language selector button -->
  <g transform="translate(1060, 18)">
    <rect width="100" height="32" rx="16" fill="#161e2e" stroke="#374151" stroke-width="1" />
    <text x="50" y="20" fill="#e5e7eb" font-size="13" text-anchor="middle">English ▾</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="150" fill="#ffffff" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Smart Agriculture Analytic System</text>
  <text x="600" y="190" fill="#9ca3af" font-size="18" text-anchor="middle">Empowering Farmers with Machine Learning &amp; AI</text>

  <!-- Cards Container (3 Cards) -->
  
  <!-- Card 1: Crop Yield Prediction -->
  <g transform="translate(80, 240)">
    <rect width="320" height="350" rx="20" fill="#111822" stroke="#1f2937" stroke-width="1.5" />
    
    <!-- Sprout Icon -->
    <g transform="translate(160, 70)">
      <circle cx="0" cy="0" r="32" fill="#064e3b" opacity="0.3" />
      <path d="M-12 12 Q-12 -12 12 -12 Q12 12 -12 12 Z" fill="#10b981" />
      <path d="M-12 12 C-2 2 12 2 12 12" stroke="#059669" stroke-width="3" fill="none" />
    </g>

    <text x="160" y="160" fill="#10b981" font-size="22" font-weight="700" text-anchor="middle">Crop Yield Prediction</text>
    <text x="160" y="195" fill="#9ca3af" font-size="13" text-anchor="middle">Predict your harvest yield based on soil, weather,</text>
    <text x="160" y="215" fill="#9ca3af" font-size="13" text-anchor="middle">and area parameters.</text>

    <!-- Blue Button -->
    <g transform="translate(80, 260)">
      <rect width="160" height="48" rx="24" fill="#0070f3" filter="url(#blueGlow)" />
      <text x="80" y="29" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Predict Yield</text>
    </g>
  </g>

  <!-- Card 2: Soil Analysis -->
  <g transform="translate(440, 240)">
    <rect width="320" height="350" rx="20" fill="#111822" stroke="#1f2937" stroke-width="1.5" />
    
    <!-- Layers Icon -->
    <g transform="translate(160, 70)">
      <circle cx="0" cy="0" r="32" fill="#064e3b" opacity="0.3" />
      <path d="M-16 -8 L0 -16 L16 -8 L0 0 Z" fill="#10b981" />
      <path d="M-16 0 L0 8 L16 0" stroke="#10b981" stroke-width="3" fill="none" />
      <path d="M-16 8 L0 16 L16 8" stroke="#059669" stroke-width="3" fill="none" />
    </g>

    <text x="160" y="160" fill="#10b981" font-size="22" font-weight="700" text-anchor="middle">Soil Analysis</text>
    <text x="160" y="195" fill="#9ca3af" font-size="13" text-anchor="middle">Classify soil quality (Poor, Medium, Fertile) using</text>
    <text x="160" y="215" fill="#9ca3af" font-size="13" text-anchor="middle">NPK chemical values.</text>

    <!-- Blue Button -->
    <g transform="translate(80, 260)">
      <rect width="160" height="48" rx="24" fill="#0070f3" filter="url(#blueGlow)" />
      <text x="80" y="29" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Check Soil</text>
    </g>
  </g>

  <!-- Card 3: Fertilizer Recommender -->
  <g transform="translate(800, 240)">
    <rect width="320" height="350" rx="20" fill="#111822" stroke="#1f2937" stroke-width="1.5" />
    
    <!-- Flask Icon -->
    <g transform="translate(160, 70)">
      <circle cx="0" cy="0" r="32" fill="#064e3b" opacity="0.3" />
      <path d="M-6 -16 H6 V-6 L14 12 C16 16 12 18 0 18 C-12 18 -16 16 -14 12 L-6 -6 Z" fill="none" stroke="#10b981" stroke-width="3" />
      <path d="M-10 8 C-5 6 5 10 10 8 L12 12 C13 14 10 16 0 16 C-10 16 -13 14 -12 12 Z" fill="#10b981" />
    </g>

    <text x="160" y="160" fill="#10b981" font-size="22" font-weight="700" text-anchor="middle">Fertilizer Recommender</text>
    <text x="160" y="195" fill="#9ca3af" font-size="13" text-anchor="middle">Get the best fertilizer suggestions based on</text>
    <text x="160" y="215" fill="#9ca3af" font-size="13" text-anchor="middle">nutrient deficiencies.</text>

    <!-- Blue Button -->
    <g transform="translate(80, 260)">
      <rect width="160" height="48" rx="24" fill="#0070f3" filter="url(#blueGlow)" />
      <text x="80" y="29" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Get Advice</text>
    </g>
  </g>
</svg>
