<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="cpsStatsGlow" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#cpsStatsGlow)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a" opacity="0.95"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#1e293b" stroke-width="1"/>
  
  <g transform="translate(48, 20)">
    <circle cx="12" cy="12" r="14" fill="#38bdf8" opacity="0.25"/>
    <path d="M12 6v6l4 2" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="36" y="17" fill="#ffffff" font-weight="800" font-size="20">Click Scorer</text>
    <text x="160" y="17" fill="#93c5fd" font-weight="500" font-size="13">/ Player Stats &amp; Tier Classification</text>
  </g>

  <!-- Title -->
  <text x="48" y="112" fill="#ffffff" font-size="28" font-weight="800">Performance Breakdown &amp; World Rank</text>
  <text x="48" y="136" fill="#93c5fd" font-size="14">Session Analysis • Butterfly &amp; Jitter click frequency detection</text>

  <!-- 3 Stats Cards Row -->
  <g transform="translate(48, 160)">
    <rect width="350" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="38" fill="#94a3b8" font-size="13">Highest CPS Recorded</text>
    <text x="24" y="78" fill="#38bdf8" font-size="34" font-weight="800">12.8</text>
    <text x="130" y="76" fill="#22c55e" font-size="13" font-weight="700">Top 1% Global</text>

    <g transform="translate(376, 0)">
      <rect width="350" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="24" y="38" fill="#94a3b8" font-size="13">Assigned Tier Rating</text>
      <text x="24" y="78" fill="#facc15" font-size="30" font-weight="900">CHEETAH ⚡</text>
      <text x="210" y="76" fill="#94a3b8" font-size="13">Godspeed class</text>
    </g>

    <g transform="translate(752, 0)">
      <rect width="352" height="110" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="24" y="38" fill="#94a3b8" font-size="13">Total Lifetime Clicks</text>
      <text x="24" y="78" fill="#ffffff" font-size="34" font-weight="800">14,820</text>
      <text x="175" y="76" fill="#38bdf8" font-size="13">100% Accurate</text>
    </g>
  </g>

  <!-- CPS Timeline Frequency Graph -->
  <g transform="translate(48, 295)">
    <rect width="1104" height="330" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="32" y="44" fill="#ffffff" font-size="18" font-weight="700">Second-by-Second Click Cadence Graph</text>
    <text x="32" y="66" fill="#94a3b8" font-size="12">Consistency tracking (Jitter suppression enabled)</text>

    <!-- Grid lines -->
    <line x1="60" y1="120" x2="1050" y2="120" stroke="#1e293b" stroke-dasharray="4"/>
    <text x="50" y="124" fill="#64748b" font-size="11" text-anchor="end">14 CPS</text>
    <line x1="60" y1="180" x2="1050" y2="180" stroke="#1e293b" stroke-dasharray="4"/>
    <text x="50" y="184" fill="#64748b" font-size="11" text-anchor="end">10 CPS</text>
    <line x1="60" y1="240" x2="1050" y2="240" stroke="#1e293b" stroke-dasharray="4"/>
    <text x="50" y="244" fill="#64748b" font-size="11" text-anchor="end">6 CPS</text>
    <line x1="60" y1="280" x2="1050" y2="280" stroke="#334155" stroke-width="1.5"/>

    <!-- Graph curve -->
    <path d="M 80 250 Q 200 130 350 160 T 550 140 T 750 115 T 900 120 T 1020 110" 
          stroke="url(#chartGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <circle cx="750" cy="115" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <rect x="705" y="65" width="90" height="32" rx="6" fill="#22c55e"/>
    <text x="750" y="86" fill="#022c22" font-size="12" font-weight="800" text-anchor="middle">PEAK 12.8</text>

    <!-- Seconds labels -->
    <text x="80" y="305" fill="#64748b" font-size="12" text-anchor="middle">0s</text>
    <text x="280" y="305" fill="#64748b" font-size="12" text-anchor="middle">1s</text>
    <text x="480" y="305" fill="#64748b" font-size="12" text-anchor="middle">2s</text>
    <text x="680" y="305" fill="#64748b" font-size="12" text-anchor="middle">3s</text>
    <text x="880" y="305" fill="#64748b" font-size="12" text-anchor="middle">4s</text>
    <text x="1020" y="305" fill="#64748b" font-size="12" text-anchor="middle">5s (Finish)</text>
  </g>
</svg>
