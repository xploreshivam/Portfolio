<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="cpsTimerGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cpsBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#cpsTimerGlow)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a" opacity="0.95"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#1e293b" stroke-width="1"/>
  
  <g transform="translate(48, 20)">
    <circle cx="12" cy="12" r="14" fill="#38bdf8" opacity="0.25"/>
    <path d="M12 6v6l4 2" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="36" y="17" fill="#ffffff" font-weight="800" font-size="20">Click Scorer</text>
    <text x="160" y="17" fill="#93c5fd" font-weight="500" font-size="13">/ Timed CPS Speed Challenge</text>
  </g>

  <!-- Title & Mode Selector -->
  <text x="600" y="125" fill="#ffffff" font-size="32" font-weight="800" text-anchor="middle">Select Test Duration</text>
  <text x="600" y="152" fill="#94a3b8" font-size="15" text-anchor="middle">Measure your raw tapping frequency with ultra-low latency Web Audio</text>

  <!-- Duration Selector Tabs -->
  <g transform="translate(360, 180)">
    <rect width="90" height="40" rx="20" fill="#1e293b"/>
    <text x="45" y="25" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="middle">1 Sec</text>

    <g transform="translate(100, 0)">
      <rect width="90" height="40" rx="20" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="45" y="25" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">5 Sec</text>
    </g>

    <g transform="translate(200, 0)">
      <rect width="90" height="40" rx="20" fill="#1e293b"/>
      <text x="45" y="25" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="middle">10 Sec</text>
    </g>

    <g transform="translate(300, 0)">
      <rect width="90" height="40" rx="20" fill="#1e293b"/>
      <text x="45" y="25" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="middle">60 Sec</text>
    </g>
  </g>

  <!-- Main Giant Tapping Pad -->
  <g transform="translate(250, 255)">
    <rect width="700" height="340" rx="24" fill="#0f172a" stroke="#1e3a8a" stroke-width="2"/>
    
    <!-- Outer concentric ring -->
    <circle cx="350" cy="170" r="120" fill="none" stroke="#1e293b" stroke-width="6"/>
    <circle cx="350" cy="170" r="120" fill="none" stroke="url(#cpsBlueGrad)" stroke-width="6" stroke-dasharray="753" stroke-dashoffset="240" stroke-linecap="round"/>
    
    <!-- Central Display -->
    <circle cx="350" cy="170" r="95" fill="#1e293b"/>
    <text x="350" y="155" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="middle">CURRENT CPS</text>
    <text x="350" y="195" fill="#38bdf8" font-size="44" font-weight="900" text-anchor="middle">11.4</text>
    <text x="350" y="218" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="middle">57 Clicks in 5.0s</text>

    <!-- Side Indicators -->
    <text x="120" y="160" fill="#94a3b8" font-size="13">Time Left:</text>
    <text x="120" y="190" fill="#ffffff" font-size="28" font-weight="800">0.0s</text>

    <text x="580" y="160" fill="#94a3b8" font-size="13" text-anchor="end">Peak Velocity:</text>
    <text x="580" y="190" fill="#22c55e" font-size="28" font-weight="800" text-anchor="end">12.8 CPS</text>

    <text x="350" y="315" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">Click anywhere to restart challenge ↺</text>
  </g>
</svg>
