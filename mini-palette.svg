<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#0a0e17; font-family: system-ui, sans-serif;">
  <rect width="800" height="450" fill="#0a0e17" />
  <text x="400" y="50" fill="#38bdf8" font-size="22" font-weight="800" text-anchor="middle">Color Palette Harmony Picker</text>

  <g transform="translate(100, 100)">
    <!-- 5 Palette Bars -->
    <rect x="0" y="0" width="110" height="230" rx="12" fill="#6366f1" />
    <text x="55" y="200" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">#6366F1</text>

    <rect x="125" y="0" width="110" height="230" rx="12" fill="#a855f7" />
    <text x="180" y="200" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">#A855F7</text>

    <rect x="250" y="0" width="110" height="230" rx="12" fill="#ec4899" />
    <text x="305" y="200" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">#EC4899</text>

    <rect x="375" y="0" width="110" height="230" rx="12" fill="#f43f5e" />
    <text x="430" y="200" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">#F43F5E</text>

    <rect x="500" y="0" width="110" height="230" rx="12" fill="#fb923c" />
    <text x="555" y="200" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">#FB923C</text>
  </g>

  <rect x="310" y="360" width="180" height="48" rx="24" fill="#38bdf8" />
  <text x="400" y="390" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">GENERATE PALETTE</text>
</svg>
