<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#0d1117; font-family: system-ui, sans-serif;">
  <rect width="800" height="450" fill="#0d1117" />
  
  <!-- Outer Timer Ring Glow -->
  <circle cx="400" cy="210" r="130" fill="none" stroke="#1f293d" stroke-width="12" />
  <circle cx="400" cy="210" r="130" fill="none" stroke="#ef4444" stroke-width="12" stroke-dasharray="816" stroke-dashoffset="200" stroke-linecap="round" />

  <!-- Time Display -->
  <text x="400" y="200" fill="#ffffff" font-size="54" font-weight="900" text-anchor="middle" letter-spacing="2">25:00</text>
  <text x="400" y="240" fill="#ef4444" font-size="16" font-weight="700" text-anchor="middle">Focus Session 🎯</text>

  <!-- Controls -->
  <rect x="310" y="360" width="180" height="48" rx="24" fill="#ef4444" />
  <text x="400" y="390" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">START TIMER</text>
</svg>
