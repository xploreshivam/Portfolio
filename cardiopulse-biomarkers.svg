<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background-color: #06150f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="cardioPulseBioGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a3d28" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#04120c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#cardioPulseBioGlow)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="64" fill="#071b12" opacity="0.95" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#123827" stroke-width="1" />
  
  <g transform="translate(48, 20)">
    <circle cx="12" cy="12" r="14" fill="#10b981" opacity="0.25"/>
    <path d="M4 12 h4 l2 -6 l4 12 l3 -8 l2 4 h5" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="36" y="17" fill="#ffffff" font-weight="800" font-size="20">CardioPulse</text>
    <text x="160" y="17" fill="#6ee7b7" font-weight="500" font-size="13">/ 16 Clinical Biomarker Triage</text>
  </g>

  <g transform="translate(1030, 18)">
    <rect width="122" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="61" y="21" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">ML Precision 99.2%</text>
  </g>

  <!-- Title -->
  <text x="48" y="112" fill="#ffffff" font-size="28" font-weight="800">Biomarker Risk Stratification Engine</text>
  <text x="48" y="136" fill="#6ee7b7" font-size="14">Real-time XGBoost cardiovascular risk triage across 16 biometric inputs</text>

  <!-- Top Real-Time ECG Waveform Card -->
  <g transform="translate(48, 155)">
    <rect width="1104" height="110" rx="14" fill="#0b2419" stroke="#15422e" stroke-width="1.5"/>
    <text x="24" y="32" fill="#9ca3af" font-size="12">Lead II Live Electrocardiogram (ECG) Monitor</text>
    <text x="24" y="58" fill="#ffffff" font-size="26" font-weight="800">72 BPM</text>
    <text x="135" y="56" fill="#34d399" font-size="12" font-weight="600">✓ Normal Sinus Rhythm</text>

    <!-- ECG Wave Path -->
    <path d="M 240 65 L 340 65 L 350 55 L 360 75 L 375 25 L 390 95 L 400 65 L 420 65 L 435 55 L 450 65 L 560 65 L 570 55 L 580 75 L 595 25 L 610 95 L 620 65 L 640 65 L 655 55 L 670 65 L 780 65 L 790 55 L 800 75 L 815 25 L 830 95 L 840 65 L 860 65 L 875 55 L 890 65 L 1000 65 L 1010 55 L 1020 75 L 1035 25 L 1050 95 L 1060 65 L 1080 65" 
          stroke="url(#ecgGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Biomarker Metrics Grid (3 columns) -->
  <g transform="translate(48, 280)">
    <!-- Column 1: Vitals -->
    <rect width="350" height="345" rx="16" fill="#0b2419" stroke="#15422e" stroke-width="1.5"/>
    <text x="24" y="38" fill="#ffffff" font-size="18" font-weight="700">Hemodynamic Vitals</text>

    <text x="24" y="80" fill="#9ca3af" font-size="13">Systolic / Diastolic BP</text>
    <text x="326" y="80" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">120 / 78 mmHg</text>
    <rect x="24" y="92" width="302" height="6" rx="3" fill="#133626"/>
    <rect x="24" y="92" width="180" height="6" rx="3" fill="#10b981"/>

    <text x="24" y="140" fill="#9ca3af" font-size="13">Pulse Pressure</text>
    <text x="326" y="140" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">42 mmHg (Normal)</text>

    <text x="24" y="200" fill="#9ca3af" font-size="13">Resting Heart Rate</text>
    <text x="326" y="200" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">68 bpm</text>

    <text x="24" y="260" fill="#9ca3af" font-size="13">Oxygen Saturation (SpO2)</text>
    <text x="326" y="260" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">99%</text>

    <text x="24" y="320" fill="#6ee7b7" font-size="12">Vascular stiffness within normal healthy limits</text>

    <!-- Column 2: Blood Chemistry -->
    <g transform="translate(376, 0)">
      <rect width="350" height="345" rx="16" fill="#0b2419" stroke="#15422e" stroke-width="1.5"/>
      <text x="24" y="38" fill="#ffffff" font-size="18" font-weight="700">Lipid &amp; Metabolic Panel</text>

      <text x="24" y="80" fill="#9ca3af" font-size="13">Total Cholesterol</text>
      <text x="326" y="80" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">178 mg/dL</text>
      <rect x="24" y="92" width="302" height="6" rx="3" fill="#133626"/>
      <rect x="24" y="92" width="190" height="6" rx="3" fill="#10b981"/>

      <text x="24" y="140" fill="#9ca3af" font-size="13">Fasting Blood Glucose</text>
      <text x="326" y="140" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">92 mg/dL</text>

      <text x="24" y="200" fill="#9ca3af" font-size="13">HDL / LDL Ratio</text>
      <text x="326" y="200" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">1.8 (Optimal)</text>

      <text x="24" y="260" fill="#9ca3af" font-size="13">Serum Creatinine</text>
      <text x="326" y="260" fill="#34d399" font-size="15" font-weight="700" text-anchor="end">0.9 mg/dL</text>

      <text x="24" y="320" fill="#6ee7b7" font-size="12">Zero indication of hypercholesterolemia</text>
    </g>

    <!-- Column 3: Overall Risk Stratification -->
    <g transform="translate(752, 0)">
      <rect width="352" height="345" rx="16" fill="#0b2419" stroke="#15422e" stroke-width="1.5"/>
      <text x="24" y="38" fill="#ffffff" font-size="18" font-weight="700">Calculated Risk Index</text>

      <g transform="translate(176, 120)">
        <circle cx="0" cy="0" r="60" fill="none" stroke="#133626" stroke-width="12"/>
        <circle cx="0" cy="0" r="60" fill="none" stroke="#10b981" stroke-width="12" stroke-dasharray="377" stroke-dashoffset="335" stroke-linecap="round"/>
        <text x="0" y="8" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">11%</text>
      </g>

      <rect x="36" y="195" width="280" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="176" y="218" fill="#ecfdf5" font-size="14" font-weight="700" text-anchor="middle">LOW CVD RISK (TIER 1)</text>

      <text x="24" y="260" fill="#9ca3af" font-size="13">10-Year ASCVD Risk Score: 1.4%</text>
      <text x="24" y="285" fill="#9ca3af" font-size="13">Model Classification: Negative for CAD</text>
      <text x="24" y="315" fill="#34d399" font-weight="600" font-size="12">Next Scheduled Screening: 12 Months</text>
    </g>
  </g>
</svg>
